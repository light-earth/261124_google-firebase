<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학생 탐구실 | SciLab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="src/styles.css" />
  <link rel="stylesheet" href="src/student.css" />
</head>
<body class="auth-pending">
  <header class="topbar">
    <a href="index.html" class="brand">
      <div class="brand-logo">⚗</div>
      <div>SciLab 학생 탐구실<small>Student Lab</small></div>
    </a>
    <div class="user-box">
      <img id="userPhoto" class="user-photo" alt="" referrerpolicy="no-referrer" hidden />
      <div class="user-info">
        <span id="userName" class="user-name"></span>
        <span id="userEmail" class="user-email"></span>
      </div>
      <a href="index.html" class="btn btn-outline btn-sm">메인</a>
      <button id="logoutBtn" class="btn btn-outline btn-sm">로그아웃</button>
    </div>
  </header>

  <main class="container lab">
    <!-- 0. OpenAI API Key -->
    <section id="keySection" class="card">
      <div class="card-head">
        <h2 class="section-title">OpenAI API Key</h2>
        <span id="keyStatus" class="status-chip error">● 연결 안 됨</span>
      </div>
      <div class="row">
        <input id="keyInput" type="password" class="input" placeholder="sk-..." autocomplete="off" />
        <button id="keyBtn" class="btn btn-primary">확인</button>
      </div>
      <p class="hint">키는 이 브라우저 탭에만 임시 저장되며, 탭을 닫으면 사라집니다.</p>
    </section>

    <!-- 1. 학년 선택 -->
    <section id="gradeSection" class="card">
      <h2 class="section-title">학년 선택</h2>
      <div class="grade-grid">
        <button class="grade-btn" data-grade="3">3학년</button>
        <button class="grade-btn" data-grade="4">4학년</button>
        <button class="grade-btn" data-grade="5">5학년</button>
        <button class="grade-btn" data-grade="6">6학년</button>
      </div>
    </section>

    <!-- 2. 실험 기록 -->
    <section id="recordSection" class="card" hidden>
      <div class="card-head">
        <h2 class="section-title">실험 기록 <span class="tag" id="gradeLabel"></span></h2>
        <span id="turnCounter" class="mono muted">TURN 1 / 7</span>
      </div>
      <div class="progress"><div id="turnProgress" class="progress-bar"></div></div>

      <div id="recordLog" class="record-log"></div>

      <div id="turnBox" class="turn-box">
        <span id="turnLabel" class="turn-label"></span>
        <p id="turnQuestion" class="turn-question"></p>
        <textarea id="turnInput" class="input" rows="3"></textarea>
        <div id="turnImageWrap" class="image-wrap" hidden>
          <label class="btn btn-outline file-btn">📷 표·그래프 사진 올리기 (선택)
            <input id="turnImage" type="file" accept="image/*" hidden />
          </label>
          <img id="turnImagePreview" class="preview" hidden alt="데이터 이미지 미리보기" />
        </div>
        <div class="row end">
          <button id="skipBtn" class="btn btn-outline">건너뛰기</button>
          <button id="nextBtn" class="btn btn-primary">기록하기 →</button>
        </div>
      </div>
      <p id="turnDone" class="done-msg" hidden>✅ 모든 기록을 마쳤어요!</p>

      <div class="start-wrap">
        <p id="keyNeeded" class="hint warn">💡 챗봇을 사용하려면 위에서 OpenAI API Key를 먼저 확인해 주세요.</p>
        <div id="startArea" hidden>
          <p id="startHint" class="hint"></p>
          <button id="startBtn" class="btn btn-accent wide" disabled>🤖 Chatbot과의 대화 시작</button>
        </div>
      </div>
    </section>

    <!-- 3. 챗봇 -->
    <section id="chatSection" class="card" hidden>
      <div class="card-head">
        <h2 class="section-title">AI 연구 도우미</h2>
        <span class="mono muted">DATA ANALYSIS ASSISTANT</span>
      </div>
      <div id="chatLog" class="chat-log"></div>

      <div class="graph-tools">
        <label class="btn btn-outline file-btn">📈 그래프 이미지 첨부
          <input id="graphImage" type="file" accept="image/*" hidden />
        </label>
        <div id="graphPreviewWrap" class="graph-preview" hidden>
          <img id="graphPreview" alt="그래프 미리보기" />
          <button id="graphClear" class="x-btn" title="첨부 취소">✕</button>
        </div>
        <button id="graphBtn" class="btn btn-primary" disabled>그래프 해석하기</button>
      </div>

      <form id="chatForm" class="chat-form">
        <textarea id="chatInput" class="input" rows="2" placeholder="궁금한 점을 물어보세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        <button id="chatSend" type="submit" class="btn btn-accent">전송</button>
      </form>
    </section>

    <!-- 4. 최종 수정 & 제출 -->
    <section id="finalSection" class="card" hidden>
      <h2 id="finalTitle" class="section-title">최종 분석 · 결론 작성</h2>
      <p id="editNotice" class="edit-notice" hidden></p>
      <p class="hint">챗봇과의 대화를 바탕으로 데이터 분석과 탐구 결론을 다듬어 보세요.</p>
      <label class="field-label" for="finalAnalysis">데이터 분석</label>
      <textarea id="finalAnalysis" class="input" rows="4"></textarea>
      <label class="field-label" for="finalConclusion">탐구 결론</label>
      <textarea id="finalConclusion" class="input" rows="4"></textarea>
      <div class="row end">
        <button id="submitBtn" class="btn btn-primary">제출하기</button>
      </div>    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
