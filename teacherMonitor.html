<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교사 모니터링 | SciLab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="src/styles.css" />
  <link rel="stylesheet" href="src/admin.css" />
</head>
<body class="auth-pending">
  <header class="topbar">
    <a href="index.html" class="brand">
      <div class="brand-logo">⚗</div>
      <div>SciLab 교사 모니터링<small>Teacher Dashboard</small></div>
    </a>
    <div class="row-inline">
      <button id="refreshBtn" class="btn btn-outline btn-sm">↻ 새로고침</button>
      <a href="index.html" class="btn btn-outline btn-sm">메인</a>
    </div>
  </header>

  <div class="dash">
    <!-- ===== 좌측: 사용자 + 필터 + 목록 ===== -->
    <aside class="panel sidebar">
      <div class="admin-card">
        <img id="adminPhoto" class="user-photo" alt="" referrerpolicy="no-referrer" hidden />
        <div class="admin-info">
          <span id="adminName" class="user-name"></span>
          <span id="adminEmail" class="mono-sm"></span>
        </div>
        <button id="logoutBtn" class="btn btn-outline btn-sm">로그아웃</button>
      </div>

      <div class="side-block">
        <div class="side-head">
          <h3>날짜 필터</h3>
          <div class="link-btns">
            <button id="checkAll" class="link-btn">전체</button>
            <button id="checkNone" class="link-btn">해제</button>
          </div>
        </div>
        <div id="dateList" class="date-list"><p class="empty">불러오는 중...</p></div>
      </div>

      <div class="side-block grow">
        <div class="side-head">
          <h3>제출 데이터</h3>
          <span id="subCount" class="count-chip">0</span>
        </div>
        <input id="searchInput" class="input input-sm" placeholder="이름 · 이메일 검색" />
        <div id="subList" class="sub-list"><p class="empty">날짜를 선택하세요.</p></div>
      </div>
    </aside>

    <!-- ===== 가운데: 실험 정보 ===== -->
    <main class="panel detail">
      <div id="detailEmpty" class="placeholder">
        <div class="ph-icon">📊</div>
        <p>왼쪽 목록에서 제출 데이터를 선택하세요.</p>
      </div>

      <div id="detailView" hidden>
        <div class="detail-head">
          <div>
            <h2 id="dName"></h2>
            <p id="dMeta" class="mono-sm"></p>
          </div>
          <div class="row-inline">
            <button id="chatToggle" class="btn btn-outline btn-sm">💬 대화 내용 보기</button>
            <button id="deleteBtn" class="btn btn-danger btn-sm">🗑 삭제</button>
          </div>
        </div>

        <div class="stat-row">
          <div class="stat"><span>학년</span><strong id="dGrade"></strong></div>
          <div class="stat"><span>소요 시간</span><strong id="dDuration"></strong></div>
          <div class="stat"><span>대화 수</span><strong id="dTurns"></strong></div>
          <div class="stat"><span>이미지</span><strong id="dImages"></strong></div>
        </div>

        <section class="info-block">
          <h3 class="block-title">실험 기록</h3>
          <dl id="dRecord" class="record-list"></dl>
        </section>

        <section class="info-block final">
          <h3 class="block-title">최종 데이터 분석</h3>
          <p id="dAnalysis" class="final-text"></p>
          <h3 class="block-title">최종 탐구 결론</h3>
          <p id="dConclusion" class="final-text"></p>
        </section>

        <section id="chatPanel" class="info-block" hidden>
          <h3 class="block-title">Chatbot 대화 내용</h3>
          <div id="dChat" class="chat-view"></div>
        </section>
      </div>
    </main>

    <!-- ===== 우측: 데이터 사진 ===== -->
    <aside class="panel gallery">
      <h3 class="side-title">데이터 사진</h3>
      <div id="gallery" class="gallery-list"><p class="empty">선택된 데이터가 없어요.</p></div>
    </aside>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="src/admin.js"></script>
</body>
</html>
